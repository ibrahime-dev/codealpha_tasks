<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | ShopEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-container">
      <a class="logo" href="index.html"><span class="logo-mark">S</span> ShopEase<span class="logo-dot">.</span></a>
      <nav class="main-nav" id="mainNav">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="products.html">Shop</a>
        <a class="nav-link" href="cart.html">Cart</a>
      </nav>
      <div class="nav-actions">
        <a class="cart-link" href="cart.html">Bag <span class="cart-count" id="cartCount">0</span></a>
      </div>
    </div>
  </header>

  <main>
    <div class="container not-found-container">
      <div class="not-found">
        <div class="not-found-number">404</div>
        <span class="eyebrow">PAGE NOT FOUND</span>
        <h1>Hmm, this page doesn't exist.</h1>
        <p>The link might be broken, or the page may have moved. Let's get you back on track.</p>
        <div class="not-found-actions">
          <a class="button button-primary" href="index.html">Back to home →</a>
          <a class="button button-outline" href="products.html">Browse products</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <span>© <span id="currentYear"></span> ShopEase.</span>
    </div>
  </footer>

  <script>
    document.getElementById("currentYear").textContent = new Date().getFullYear();
    const count = (() => {
      try { return (JSON.parse(localStorage.getItem("cart")||"[]")||[]).reduce((s,i)=>s+(Number(i.quantity)||0),0); } catch { return 0; }
    })();
    document.getElementById("cartCount").textContent = count;
  </script>
</body>
</html>
